# =============================================================================
# HAProxy de CR_Chat
#   :5000  escritura -> líder de Patroni      (GET /primary  == 200)
#   :5001  lectura   -> réplicas sanas        (GET /replica  == 200), y si no
#                       queda ninguna, el líder (fallback)
#   :9443  TLS -> minio:9000 (solo red interna; pgBackRest exige HTTPS para S3)
#   :7000  página de estadísticas (publicada solo en 127.0.0.1)
#   :8404  /salud para el healthcheck (falla si no hay líder)
# Los chequeos usan la API REST de Patroni (puerto 8008), no el puerto de Postgres.
# =============================================================================
global
    maxconn 1000
    log stdout format raw local0 info

defaults
    log     global
    mode    tcp
    option  tcplog
    retries 2
    timeout connect 4s
    timeout client  30m
    timeout server  30m
    timeout check   2s

# Resolver de Docker: HAProxy arranca aunque pg1/pg2/minio aún no existan y
# sigue los cambios de IP al recrear contenedores.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold other      5s
    hold refused    5s
    hold nx         5s
    hold timeout    5s
    hold obsolete   5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends

frontend salud
    mode http
    bind *:8404
    monitor-uri /salud
    monitor fail if { nbsrv(escritura) lt 1 }

# --- Escritura (líder) --------------------------------------------------------
frontend pg_escritura
    bind *:5000
    default_backend escritura

backend escritura
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    # inter 1s + fall 2: un ex líder sale del pool en ~2 s; shutdown-sessions corta
    # las conexiones abiertas para que la app reconecte al nuevo líder.
    default-server inter 1s fastinter 1s downinter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 pg1:5432 maxconn 140 check port 8008
    server pg2 pg2:5432 maxconn 140 check port 8008

# --- Lectura (réplicas, con fallback al líder) --------------------------------
frontend pg_lectura
    bind *:5001
    use_backend lectura_replicas if { nbsrv(lectura_replicas) gt 0 }
    default_backend escritura

backend lectura_replicas
    balance leastconn
    option httpchk
    # lag máximo de 10 MiB para servir lecturas
    http-check send meth GET uri /replica?lag=10MB
    http-check expect status 200
    default-server inter 2s fastinter 1s downinter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg1 pg1:5432 maxconn 140 check port 8008
    server pg2 pg2:5432 maxconn 140 check port 8008

# --- S3 con TLS para pgBackRest (MinIO habla HTTP plano en la red interna) ----
frontend s3_tls
    bind *:9443 ssl crt /certs/haproxy.pem
    default_backend minio

backend minio
    default-server inter 5s resolvers docker init-addr last,libc,none
    server minio minio:9000 check
