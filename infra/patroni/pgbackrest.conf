# =============================================================================
# pgBackRest en los nodos pg1/pg2: archive-push / archive-get contra el
# repositorio S3 (MinIO detrás del terminador TLS de HAProxy, haproxy:9443) y
# servidor TLS para el host de respaldo (`backup`).
# Secretos por entorno (nunca aquí): PGBACKREST_REPO1_S3_KEY,
# PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS.
# =============================================================================
[global]
repo1-type=s3
repo1-s3-endpoint=haproxy
repo1-storage-port=9443
repo1-s3-bucket=cr-chat-backups
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-storage-ca-file=/certs/ca.crt
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc

compress-type=zst
compress-level=3
# archive-push asíncrono: Postgres no espera a S3 por cada segmento.
archive-async=y
archive-push-queue-max=2GiB
spool-path=/var/lib/postgresql/data/pgbackrest-spool
process-max=2
lock-path=/tmp/pgbackrest
log-level-console=warn
log-level-stderr=warn
log-level-file=off

# Servidor TLS (puerto 8432). Certificado/clave por nodo en el entrypoint.
tls-server-address=*
tls-server-ca-file=/certs/ca.crt
tls-server-auth=backup=crchat

[crchat]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-socket-path=/var/run/postgresql
pg1-port=5432
