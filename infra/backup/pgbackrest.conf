# =============================================================================
# pgBackRest en el host de respaldo (`backup`): dueño del repositorio S3 y de
# los respaldos full/diff. Se conecta a pg1/pg2 por TLS (puerto 8432) con un
# certificado cliente CN=backup y respalda siempre desde el líder.
# Secretos por entorno: PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET,
# PGBACKREST_REPO1_CIPHER_PASS.
# =============================================================================
[global]
repo1-type=s3
repo1-s3-endpoint=haproxy
repo1-storage-port=9443
repo1-s3-bucket=cr-chat-backups
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-storage-ca-file=/certs/ca.crt
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc

# Retención: 2 full (semanales) => ventana de PITR de 7 a 14 días. Los diff
# dependen de su full y caen con ella; el WAL anterior a la full más antigua
# se expira automáticamente al terminar cada respaldo.
repo1-retention-full-type=count
repo1-retention-full=2
repo1-retention-diff=6

compress-type=zst
compress-level=3
process-max=2
start-fast=y
# Respaldo desde el líder (el lado pg detecta cuál es); el otro nodo puede estar caído.
backup-standby=n
lock-path=/tmp/pgbackrest
log-level-console=info
log-level-stderr=warn
log-level-file=off

[crchat]
pg1-host=pg1
pg1-host-type=tls
pg1-host-port=8432
pg1-host-ca-file=/certs/ca.crt
pg1-host-cert-file=/certs/backup.crt
pg1-host-key-file=/certs/backup.key
pg1-path=/var/lib/postgresql/data/pgdata
pg1-socket-path=/var/run/postgresql

pg2-host=pg2
pg2-host-type=tls
pg2-host-port=8432
pg2-host-ca-file=/certs/ca.crt
pg2-host-cert-file=/certs/backup.crt
pg2-host-key-file=/certs/backup.key
pg2-path=/var/lib/postgresql/data/pgdata
pg2-socket-path=/var/run/postgresql
