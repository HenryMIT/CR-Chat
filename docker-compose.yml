# =============================================================================
# CR_Chat - docker compose
#
# Servicios de DATOS (DBA): certs, etcd, pg1, pg2, haproxy, minio, minio-init,
#   dbmate, db-init, backup; profile `demo`: db-seed; profile `cdc`: mysql,
#   kafka, connect, cdc-init.
# Servicios de APLICACIÓN (backend: web-datos, ws, redis; frontend: web): sus
#   bloques van al final, sin cambios salvo lo marcado "(DBA)".
# Arquitectura y puertos: docs/db/infraestructura.md. Recuperación: docs/db/recuperacion.md.
#
# Todos los datos viven en volúmenes con nombre de Docker (no en carpetas del
# repo). Puertos publicados solo en 127.0.0.1. Secretos: .env (ver .env.example).
#
#   docker compose up -d --wait haproxy backup        # núcleo (HA + migraciones + respaldos)
#   docker compose --profile demo up db-seed          # usuarios de demo
#   docker compose --profile cdc up -d --wait mysql kafka connect && docker compose --profile cdc up cdc-init
# =============================================================================

x-patroni-imagen: &patroni-imagen
  image: crchat/patroni:17
  build:
    context: ./infra
    dockerfile: patroni/Dockerfile
    target: patroni

x-backup-imagen: &backup-imagen
  image: crchat/backup:17
  build:
    context: ./infra
    dockerfile: patroni/Dockerfile
    target: backup

x-nodo-pg: &nodo-pg
  <<: *patroni-imagen
  restart: unless-stopped
  init: true
  stop_grace_period: 40s
  shm_size: 128m
  depends_on:
    certs:
      condition: service_completed_successfully
    etcd:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8008/health"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 60s
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 640M

x-entorno-patroni: &entorno-patroni
  TZ: ${TZ:-UTC}
  PATRONI_ETCD3_HOSTS: etcd:2379
  PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?define POSTGRES_SUPERUSER_PASSWORD en .env}
  PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD:?define PATRONI_REPLICATION_PASSWORD en .env}
  PATRONI_RESTAPI_USERNAME: ${PATRONI_RESTAPI_USERNAME:-patroni}
  PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD:?define PATRONI_RESTAPI_PASSWORD en .env}
  PGBACKREST_REPO1_S3_KEY: ${MINIO_BACKUP_ACCESS_KEY:?define MINIO_BACKUP_ACCESS_KEY en .env}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${MINIO_BACKUP_SECRET_KEY:?define MINIO_BACKUP_SECRET_KEY en .env}
  PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?define PGBACKREST_CIPHER_PASS en .env}
  # Solo para restaurar el clúster a un instante (infra/scripts/restaurar-cluster.sh).
  CRCHAT_PITR_OBJETIVO: ${CRCHAT_PITR_OBJETIVO:-}

services:

  # ---------------------------------------------------------------------------
  # Certificados internos (CA, TLS de pgBackRest y del endpoint S3). Una vez.
  # ---------------------------------------------------------------------------
  certs:
    <<: *backup-imagen
    entrypoint: ["/usr/local/bin/crchat-generar-certs"]
    restart: on-failure:3
    volumes:
      - certs:/certs
    deploy:
      resources:
        limits:
          memory: 64M

  # ---------------------------------------------------------------------------
  # DCS de Patroni (1 nodo; failsafe_mode en Patroni tolera su caída breve).
  # ---------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd1=http://etcd:2380
      - --initial-cluster-state=new
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
      - --quota-backend-bytes=268435456
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ---------------------------------------------------------------------------
  # PostgreSQL 17 + Patroni (2 nodos, replicación en streaming).
  # ---------------------------------------------------------------------------
  pg1:
    <<: *nodo-pg
    hostname: pg1
    environment:
      <<: *entorno-patroni
      PATRONI_NAME: pg1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
    volumes:
      - pg1_data:/var/lib/postgresql/data
      - certs:/certs:ro

  pg2:
    <<: *nodo-pg
    hostname: pg2
    environment:
      <<: *entorno-patroni
      PATRONI_NAME: pg2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
    volumes:
      - pg2_data:/var/lib/postgresql/data
      - certs:/certs:ro

  # ---------------------------------------------------------------------------
  # HAProxy: 5000 escritura (líder), 5001 lectura (réplicas -> líder),
  # 9443 TLS hacia MinIO (pgBackRest), 7000 estadísticas.
  # El backend se conecta a haproxy:5000 / haproxy:5001 dentro de la red.
  # ---------------------------------------------------------------------------
  haproxy:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - certs:/certs:ro
    ports:
      - "127.0.0.1:${PG_RW_PORT:-5000}:5000"
      - "127.0.0.1:${PG_RO_PORT:-5001}:5001"
      - "127.0.0.1:${HAPROXY_STATS_PORT:-7000}:7000"
    healthcheck:
      # 200 solo si hay un líder detrás del puerto 5000.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/salud"]
      interval: 3s
      timeout: 2s
      retries: 40
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M

  # ---------------------------------------------------------------------------
  # MinIO: respaldos (cr-chat-backups) y archivos de la API (cr-chat-media).
  # Imagen de Chainguard: MinIO dejó de publicar imágenes oficiales en 2025.
  # ---------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?define MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?define MINIO_ROOT_PASSWORD en .env}
      # Subidas prefirmadas desde el navegador (origen del frontend).
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGIN:-http://localhost:5173}
      MINIO_BROWSER_REDIRECT: "off"
      MC_HOST_local: http://localhost:9000
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  minio-init:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    restart: on-failure:3
    entrypoint: ["/bin/sh", "/politicas/init.sh"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BACKUP_ACCESS_KEY: ${MINIO_BACKUP_ACCESS_KEY}
      MINIO_BACKUP_SECRET_KEY: ${MINIO_BACKUP_SECRET_KEY}
      MINIO_API_ACCESS_KEY: ${MINIO_API_ACCESS_KEY:?define MINIO_API_ACCESS_KEY en .env}
      MINIO_API_SECRET_KEY: ${MINIO_API_SECRET_KEY:?define MINIO_API_SECRET_KEY en .env}
    volumes:
      - ./infra/minio:/politicas:ro
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Bootstrap de la base: migraciones (dbmate) -> credenciales -> [seed demo].
  # ---------------------------------------------------------------------------
  dbmate:
    image: ghcr.io/amacneil/dbmate:2
    restart: on-failure:3
    depends_on:
      haproxy:
        condition: service_healthy
    # La 001 crea roles y extensiones: requiere superusuario. Las demás hacen
    # SET LOCAL ROLE migrator (todos los objetos quedan con dueño migrator).
    command: ["--no-dump-schema", "--wait", "--wait-timeout", "120s", "up"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_SUPERUSER_PASSWORD}@haproxy:5000/${DB_NAME:-cr_chat}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
    volumes:
      - ./Postgres/migraciones:/db/migrations:ro
    deploy:
      resources:
        limits:
          memory: 64M

  db-init:
    <<: *patroni-imagen
    restart: on-failure:3
    depends_on:
      dbmate:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        extra=()
        [ -n "$${DB_CDC_PASSWORD:-}" ] && extra=(-v cdc_password="$$DB_CDC_PASSWORD")
        psql -X -h haproxy -p 5000 -U postgres -d "$$DB_NAME" -v ON_ERROR_STOP=1 \
          -v migrator_password="$$DB_MIGRATOR_PASSWORD" \
          -v app_rw_password="$$DB_APP_RW_PASSWORD" \
          -v app_ro_password="$$DB_APP_RO_PASSWORD" "$${extra[@]}" \
          -f /bootstrap/asignar-credenciales.sql
        echo "db-init: credenciales aplicadas"
    environment:
      DB_NAME: ${DB_NAME:-cr_chat}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?define DB_MIGRATOR_PASSWORD en .env}
      DB_APP_RW_PASSWORD: ${DB_APP_RW_PASSWORD:?define DB_APP_RW_PASSWORD en .env}
      DB_APP_RO_PASSWORD: ${DB_APP_RO_PASSWORD:?define DB_APP_RO_PASSWORD en .env}
      DB_CDC_PASSWORD: ${DB_CDC_PASSWORD:-}
    volumes:
      - ./Postgres/bootstrap:/bootstrap:ro
    deploy:
      resources:
        limits:
          memory: 64M

  db-seed:
    <<: *patroni-imagen
    profiles: ["demo"]
    restart: on-failure:3
    depends_on:
      db-init:
        condition: service_completed_successfully
    entrypoint: ["psql", "-X", "-h", "haproxy", "-p", "5000", "-U", "app_rw", "-v", "ON_ERROR_STOP=1", "-f", "/seed/demo.sql"]
    environment:
      PGDATABASE: ${DB_NAME:-cr_chat}
      PGPASSWORD: ${DB_APP_RW_PASSWORD}
    volumes:
      - ./Postgres/seed:/seed:ro
    deploy:
      resources:
        limits:
          memory: 64M

  # ---------------------------------------------------------------------------
  # Respaldos y mantenimiento (pgBackRest repo host + cron), fuera de los nodos.
  # ---------------------------------------------------------------------------
  backup:
    <<: *backup-imagen
    restart: unless-stopped
    init: true
    depends_on:
      db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      pg1:
        condition: service_healthy
      pg2:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      DB_NAME: ${DB_NAME:-cr_chat}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      PGBACKREST_REPO1_S3_KEY: ${MINIO_BACKUP_ACCESS_KEY}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${MINIO_BACKUP_SECRET_KEY}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS}
    volumes:
      - certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/backup-listo && pidof cron >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # ---------------------------------------------------------------------------
  # CDC (profile `cdc`): PostgreSQL -> Debezium -> Kafka -> JDBC sink -> MySQL.
  # MySQL es una réplica de SOLO LECTURA (no es fallback de escritura).
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    profiles: ["cdc"]
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_DATABASE: crchat
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_SINK_PASSWORD: ${MYSQL_SINK_PASSWORD:?define MYSQL_SINK_PASSWORD en .env}
      MYSQL_READER_PASSWORD: ${MYSQL_READER_PASSWORD:?define MYSQL_READER_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./MysqlB/conf/crchat.cnf:/etc/mysql/conf.d/crchat.cnf:ro
      - ./MysqlB/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  kafka:
    image: apache/kafka:4.1.0
    profiles: ["cdc"]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  connect:
    image: quay.io/debezium/connect:3.3
    profiles: ["cdc"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      haproxy:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: crchat-connect
      CONFIG_STORAGE_TOPIC: crchat_connect_configs
      OFFSET_STORAGE_TOPIC: crchat_connect_offsets
      STATUS_STORAGE_TOPIC: crchat_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx512m
      # Los conectores leen las contraseñas con ${env:VAR}: nunca van en su JSON.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DB_NAME: ${DB_NAME:-cr_chat}
      DB_CDC_PASSWORD: ${DB_CDC_PASSWORD:?define DB_CDC_PASSWORD en .env}
      MYSQL_SINK_PASSWORD: ${MYSQL_SINK_PASSWORD}
    volumes:
      - ./infra/cdc:/cdc:ro
    ports:
      - "127.0.0.1:${CONNECT_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M

  cdc-init:
    <<: *patroni-imagen
    profiles: ["cdc"]
    restart: on-failure:3
    depends_on:
      connect:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/cdc/init.sh"]
    environment:
      DB_NAME: ${DB_NAME:-cr_chat}
      DB_CDC_PASSWORD: ${DB_CDC_PASSWORD}
      PATRONI_RESTAPI_USERNAME: ${PATRONI_RESTAPI_USERNAME:-patroni}
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD}
    volumes:
      - ./infra/cdc:/cdc:ro
    deploy:
      resources:
        limits:
          memory: 64M

  # ===========================================================================
  # Aplicación (backend y frontend; bloques de sus agentes, sin cambios salvo
  # los marcados "(DBA)").
  # ===========================================================================
  # API REST v1 (Slim 4 + Apache). PostgreSQL por haproxy:5000 (escritura) y haproxy:5001 (lectura);
  # los servicios haproxy y minio los define el agente DBA. Variables: datos/.env (ver datos/.env.example).
  web-datos:
    # (DBA) Sin container_name: "servidor-datos" choca con el contenedor detenido del esquema
    # anterior; el nombre lo pone el proyecto de compose (p. ej. cr_chat-web-datos-1).
    build:
      context: .
      dockerfile: ./datos/Dockerfile
    env_file:
      - ./datos/.env
    environment:
      DB_RW_HOST: haproxy
      DB_RW_PORT: "5000"
      DB_RO_HOST: haproxy
      DB_RO_PORT: "5001"
      REDIS_HOST: redis
    volumes:
      - ./datos/src:/var/www/html/src:ro
      - ./datos/public:/var/www/html/public:ro
      - ./docs/contratos/openapi.yaml:/var/www/html/openapi/openapi.yaml:ro
    ports:
      - 8000:80
    depends_on:
      redis: { condition: service_healthy }
      # (DBA) datos listos: líder detrás de haproxy, credenciales aplicadas, MinIO con bucket y usuario.
      haproxy: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # WebSocket (Workerman): misma imagen que web-datos con otro comando. Incluye el job horario de
  # huérfanos de media (proceso cr-chat-tareas).
  ws:
    build:
      context: .
      dockerfile: ./datos/Dockerfile
    command: ["php", "ws/server.php", "start"]
    env_file:
      - ./datos/.env
    environment:
      DB_RW_HOST: haproxy
      DB_RW_PORT: "5000"
      DB_RO_HOST: haproxy
      DB_RO_PORT: "5001"
      REDIS_HOST: redis
    volumes:
      - ./datos/src:/var/www/html/src:ro
      - ./datos/ws:/var/www/html/ws:ro
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",8080,$$e,$$m,1); exit($$s?0:1);'"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      redis: { condition: service_healthy }
      # (DBA) datos listos: líder detrás de haproxy, credenciales aplicadas, MinIO con bucket y usuario.
      haproxy: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # Redis: sesiones activas, rate limiting y pub/sub API -> WS. Sin puerto publicado; contraseña
  # REDIS_PASSWORD de datos/.env (se escribe en un archivo de configuración, no en la línea de comandos).
  redis:
    image: redis:7-alpine
    env_file:
      - ./datos/.env
    command: ["sh", "-c", "printf 'requirepass %s\\nappendonly yes\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Frontend React (solo desarrollo): Vite con HMR en http://localhost:5173.
  web:
    build:
      context: ./presentacion
      dockerfile: Dockerfile.dev
    environment:
      # Sondeo del sistema de archivos: HMR fiable con bind mounts en Windows/macOS.
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8080/ws}
      - VITE_USE_MOCKS=${VITE_USE_MOCKS:-true}
    ports:
      - 5173:5173
    volumes:
      - ./presentacion:/app
      # node_modules vive solo en el volumen con nombre (no se mezcla con el host).
      - web_node_modules:/app/node_modules
      # Contrato OpenAPI de solo lectura para `npm run gen:api` dentro del contenedor.
      - ./docs/contratos:/docs/contratos:ro

volumes:
  certs:
  etcd_data:
  pg1_data:
  pg2_data:
  minio_data:
  mysql_data:
  kafka_data:
  redis-datos:
  web_node_modules:
