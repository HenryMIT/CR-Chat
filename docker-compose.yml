services:

  servermysql:
    build:
      context: ./MysqlB
      dockerfile: Dockerfile
    container_name: servermysql
    environment:
      - MYSQL_DATABASE=${DB_NAME:-CR_Chat}
      - MYSQL_USER=${MYSQL_USER:-admin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-***REMOVED***}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-***REMOVED***}
    ports:
      - 3306:3306
    volumes:
      - ./MysqlB/mysqlData:/var/lib/mysql
      - ./MysqlB/mysql-init:/docker-entrypoint-initdb.d
      - ./MysqlB/backup:/backup
      - ./MysqlB/logs:/var/log/mysqlbackup

  serverPG:
    image: cr_chat_postgresql
    container_name: serverPG
    environment:
      - POSTGRES_DB=${DB_NAME:-CR_Chat}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-***REMOVED***}
    build:
      context: .
      dockerfile: ./Postgres/Dockerfile
    ports:
      - 5432:5432
    volumes:
      - ./Postgres/postgreData:/var/lib/postgresql/data
      - ./Postgres/postgres-init:/docker-entrypoint-initdb.d
      - ./Postgres/backup:/backup
      - ./Postgres/logs:/var/log

  # API REST v1 (Slim 4 + Apache). PostgreSQL por haproxy:5000 (escritura) y haproxy:5001 (lectura);
  # los servicios haproxy y minio los define el agente DBA. Variables: datos/.env (ver datos/.env.example).
  web-datos:
    container_name: servidor-datos
    build:
      context: .
      dockerfile: ./datos/Dockerfile
    env_file:
      - ./datos/.env
    environment:
      DB_RW_HOST: haproxy
      DB_RW_PORT: "5000"
      DB_RO_HOST: haproxy
      DB_RO_PORT: "5001"
      REDIS_HOST: redis
    volumes:
      - ./datos/src:/var/www/html/src:ro
      - ./datos/public:/var/www/html/public:ro
      - ./docs/contratos/openapi.yaml:/var/www/html/openapi/openapi.yaml:ro
    ports:
      - 8000:80
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  # WebSocket (Workerman): misma imagen que web-datos con otro comando. Incluye el job horario de
  # huérfanos de media (proceso cr-chat-tareas).
  ws:
    build:
      context: .
      dockerfile: ./datos/Dockerfile
    command: ["php", "ws/server.php", "start"]
    env_file:
      - ./datos/.env
    environment:
      DB_RW_HOST: haproxy
      DB_RW_PORT: "5000"
      DB_RO_HOST: haproxy
      DB_RO_PORT: "5001"
      REDIS_HOST: redis
    volumes:
      - ./datos/src:/var/www/html/src:ro
      - ./datos/ws:/var/www/html/ws:ro
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",8080,$$e,$$m,1); exit($$s?0:1);'"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Redis: sesiones activas, rate limiting y pub/sub API -> WS. Sin puerto publicado; contraseña
  # REDIS_PASSWORD de datos/.env (se escribe en un archivo de configuración, no en la línea de comandos).
  redis:
    image: redis:7-alpine
    env_file:
      - ./datos/.env
    command: ["sh", "-c", "printf 'requirepass %s\\nappendonly yes\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Frontend React (solo desarrollo): Vite con HMR en http://localhost:5173.
  web:
    build:
      context: ./presentacion
      dockerfile: Dockerfile.dev
    environment:
      # Sondeo del sistema de archivos: HMR fiable con bind mounts en Windows/macOS.
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8080/ws}
      - VITE_USE_MOCKS=${VITE_USE_MOCKS:-true}
    ports:
      - 5173:5173
    volumes:
      - ./presentacion:/app
      # node_modules vive solo en el volumen con nombre (no se mezcla con el host).
      - web_node_modules:/app/node_modules
      # Contrato OpenAPI de solo lectura para `npm run gen:api` dentro del contenedor.
      - ./docs/contratos:/docs/contratos:ro

volumes:
  redis-datos:
  web_node_modules:
