services:

  servermysql:
    build:
      context: ./MysqlB
      dockerfile: Dockerfile
    container_name: servermysql
    environment:
      - MYSQL_DATABASE=${DB_NAME:-CR_Chat}
      - MYSQL_USER=${MYSQL_USER:-admin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-***REMOVED***}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-***REMOVED***}
    ports:
      - 3306:3306
    volumes:
      - ./MysqlB/mysqlData:/var/lib/mysql
      - ./MysqlB/mysql-init:/docker-entrypoint-initdb.d
      - ./MysqlB/backup:/backup
      - ./MysqlB/logs:/var/log/mysqlbackup

  serverPG:
    image: cr_chat_postgresql
    container_name: serverPG
    environment:
      - POSTGRES_DB=${DB_NAME:-CR_Chat}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-***REMOVED***}
    build:
      context: .
      dockerfile: ./Postgres/Dockerfile
    ports:
      - 5432:5432
    volumes:
      - ./Postgres/postgreData:/var/lib/postgresql/data
      - ./Postgres/postgres-init:/docker-entrypoint-initdb.d
      - ./Postgres/backup:/backup
      - ./Postgres/logs:/var/log

  web-datos:
    container_name: servidor-datos
    volumes:
      - ./datos/src:/var/www/html/src
      - ./datos/public:/var/www/html/public
      - ./datos/.env:/var/www/html/.env:ro
    build:
      context: .
      dockerfile: ./datos/Dockerfile
    ports:
      - 8000:80
    depends_on:
      - serverPG
      - servermysql

  # Frontend React (solo desarrollo): Vite con HMR en http://localhost:5173.
  web:
    build:
      context: ./presentacion
      dockerfile: Dockerfile.dev
    environment:
      # Sondeo del sistema de archivos: HMR fiable con bind mounts en Windows/macOS.
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8080/ws}
      - VITE_USE_MOCKS=${VITE_USE_MOCKS:-true}
    ports:
      - 5173:5173
    volumes:
      - ./presentacion:/app
      # node_modules vive solo en el volumen con nombre (no se mezcla con el host).
      - web_node_modules:/app/node_modules
      # Contrato OpenAPI de solo lectura para `npm run gen:api` dentro del contenedor.
      - ./docs/contratos:/docs/contratos:ro

volumes:
  web_node_modules:
