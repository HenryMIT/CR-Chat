<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CR_Chat: mensajería 1:1 en tiempo real." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b5f53" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101413" media="(prefers-color-scheme: dark)" />
    <title>CR_Chat</title>
    <script>
      // Aplica el tema antes de pintar para evitar el destello claro/oscuro.
      ;(function () {
        try {
          var t = localStorage.getItem('crchat.tema') || 'sistema'
          var oscuro = t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (oscuro) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
